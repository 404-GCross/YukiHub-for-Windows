version: "3"

info:
  companyName: YukiHub
  productName: YukiHub
  productIdentifier: com.yukihub.desktop
  description: YukiHub game library manager
  copyright: Copyright (c) YukiHub contributors
  comments: YukiHub game library manager
  version: 0.1.0

protocols:
  - scheme: yukihub
    description: YukiHub Protocol

dev_mode:
  root_path: .
  log_level: info
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
