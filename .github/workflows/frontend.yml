name: Frontend Checks

on:
  push:
    branches: [main, master, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  quality:
    name: Audit, Lint, Check, and Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        working-directory: ./frontend
        # 只看生产依赖：devDependencies 的告警不应阻塞 CI（与上游 LunaBox 一致）
        run: pnpm audit --prod

      - name: Run ESLint
        working-directory: ./frontend
        run: pnpm exec eslint src --format compact

      - name: Check internationalization files
        working-directory: ./frontend
        run: pnpm run i18n:check

      # UnoCSS 对「色板缺档 / 动画名不存在」不报错也不生成 CSS，
      # 遮罩变透明这种线上问题就是这么来的（见 bg-brand-950）
      - name: Check UnoCSS tokens
        working-directory: ./frontend
        run: pnpm run uno:check

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build
