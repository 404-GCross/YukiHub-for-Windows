name: Internal Checks

on:
  push:
    branches: [main, master, develop]
    paths:
      - "internal/**"
      - "cmd/**"
      - "updater/**"
      - "build/**"
      - "scripts/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - ".github/workflows/internal.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "internal/**"
      - "cmd/**"
      - "updater/**"
      - "build/**"
      - "scripts/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - ".github/workflows/internal.yml"

permissions:
  contents: read

concurrency:
  group: internal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go and frontend checks (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请先执行 gofmt -w 再提交："
            echo "$unformatted"
            exit 1
          fi

      - name: Install matching Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: Vet
        run: go vet ./...

      - name: Test
        # 上游这一步是 go test -run '^$' ./internal/...，只编译、不执行任何用例。
        # YukiHub for Windows 要求测试真实执行，否则重构与裁剪没有任何安全网。
        run: go test ./... -count=1

      - name: Test updater module
        working-directory: ./updater
        run: go test ./... -count=1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        working-directory: ./frontend
        run: pnpm run build

      - name: Build application with Wails v3
        run: wails3 build

  checks-linux:
    name: Go and frontend checks (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请先执行 gofmt -w 再提交："
            echo "$unformatted"
            exit 1
          fi

      - name: Install matching Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: Patch Wails Linux tray support
        shell: bash
        run: ./scripts/patch-wails-linux-tray.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test updater module
        working-directory: ./updater
        run: go test ./... -count=1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        working-directory: ./frontend
        run: pnpm run build

      - name: Build application with Wails v3
        run: wails3 build
